# Cacher on a staging host: web administration open, no credentials.
#
# Appropriate only where anyone clearing the cache is genuinely harmless.
# On production use examples/cacher-production.conf instead.

CacherCacheRoot /var/cache/cacher
LogLevel info cacher:trace1

CacherAdminPath /cacher-admin

# Off = serve the admin endpoints to anyone Apache lets through, including
# anonymous requests. Deliberate here; the worst case is somebody forcing a
# staging site to regenerate.
CacherAdminRequireUser Off
