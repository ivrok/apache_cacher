# Cacher on a production host: caching on, web administration behind auth.
#
# Omit the CacherAdminPath block entirely if the `cacher` CLI on the box is
# enough - that is the default and the safest option.

CacherCacheRoot /var/cache/cacher
LogLevel info cacher:warn

CacherAdminPath /cacher-admin

# CacherAdminRequireUser defaults to On, so an admin request without an
# authenticated user is refused. Left implicit rather than written out,
# so nobody "tidies up" a line that looks redundant and opens the endpoint.

<Location /cacher-admin>
    AuthType Basic
    AuthName "Cache admin"
    AuthUserFile /etc/apache2/cacher.htpasswd
    Require valid-user
</Location>

# Front-controller applications (WordPress, Laravel, Symfony) rewrite every
# unmatched URL to a single entry point, which would swallow the admin path.
# Exempt it, above the application's own rules, in the site's .htaccess or
# vhost:
#
#   <IfModule mod_rewrite.c>
#   RewriteEngine On
#   RewriteRule ^cacher-admin - [END]
#   </IfModule>
